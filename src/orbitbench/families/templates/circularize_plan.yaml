name: circularize_plan
levels:
  maneuvers: 3

epoch: "01 Jan 2026 00:00:00.000"
final_margin_s: 600

ranges:
  sma_km: [8000.0, 30000.0]
  ecc: [0.1, 0.6]
  inc_deg: [0.0, 98.0]
  raan_deg: [0.0, 360.0]
  aop_deg: [0.0, 360.0]
  ta_deg: [0.0, 360.0]
min_periapsis_km: 6700.0
min_apsis_distance_deg: 5.0   # the initial position is not within this angle of apoapsis
dv_margin_m_s: 1.0

tolerance:
  ecc_max: 0.001
  inc_deg: 0.001

statement:
  common: >-
    A spacecraft named {satellite} is on an Earth orbit with these elements on {epoch} UTC, in the Earth
    mean-equator and mean-equinox of J2000 inertial frame: semi-major axis {sma_km} km, eccentricity {ecc},
    inclination {inc_deg} deg, right ascension of the ascending node {raan_deg} deg, argument of periapsis
    {aop_deg} deg, true anomaly {ta_deg} deg.

    Physical model, which applies to every number you give: the Earth is a point mass with
    mu = {mu} km^3/s^2 and nothing else acts on the spacecraft. Distances are in km, velocities in km/s and
    angles in degrees, unless a field name says otherwise.

    Task: make the orbit circular with a single impulsive burn, at the date and in the direction of your
    choice, without changing its plane. The total delta-v, the sum of the magnitudes of your burns, must not
    exceed {budget_m_s} m/s.
  maneuvers: >-
    Give the maneuver plan in the field maneuvers: one entry per burn, in chronological order. Each entry has
    epoch_utc (format 'DD Mon YYYY HH:MM:SS.mmm', UTC, to the millisecond), spacecraft ('{satellite}'),
    frame (one of VNB, LVLH, MJ2000Eq, Inertial) and delta_v_km_s (three components in km/s, in that frame;
    in VNB the first component is along the velocity). A burn may be applied at the initial epoch.

    Your plan is replayed in GMAT R2026a from the initial state, with the model above and a Prince-Dormand 7(8)
    integrator of accuracy 1e-12, and the final state is checked on {final_epoch} UTC: the eccentricity below
    {ecc_max}, the inclination within {inc_tol} deg of {inc_deg} deg, and the total delta-v within the budget.
